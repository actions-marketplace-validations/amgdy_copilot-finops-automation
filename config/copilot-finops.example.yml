# yaml-language-server: $schema=../schemas/v3/copilot-finops.schema.json
#
# Worked example of a Copilot FinOps config (v3). v3 is budgets-first: it manages
# GitHub Copilot AI-credit budgets. There is NO enterprise field — pass your
# enterprise slug via the action's `enterprise` input (so real slugs stay out of
# tracked config). `budgets` is optional; write only what you need.
#
# `scope` says who a budget is for. `metered_credits_only` (default false) picks
# whether it caps the whole shared-pool + metered phase per user (the default,
# a per-user hard stop) or only metered spend after the pool (collective).
version: 3

budgets:
  # all_users -> universal per-user budget for every licensed user (pool + metered,
  # always hard-stop). At most one.
  - name: all-users-default
    scope: all_users
    amount: 30

  # user -> individual per-user budget for each login (pool + metered, hard-stop).
  # Overrides the universal and cost-center user-level budgets for those logins.
  - name: power-users
    scope: user
    users: [octocat, monalisa]
    amount: 75

  # cost_center (default) -> per-user pool+metered cap for every member of the
  # named cost center (multi_user_cost_center, hard-stop).
  - name: engineering-per-user
    scope: cost_center
    cost_center: engineering
    amount: 20

  # cost_center + metered_credits_only -> collective metered cap for the cost
  # center after the pool. enforce: false = alert-only (default true = hard-stop).
  - name: engineering-metered-cap
    scope: cost_center
    cost_center: engineering
    metered_credits_only: true
    amount: 500
    enforce: false
    alerts: [eng-billing-admin]

  # team (default) -> per-member pool+metered cap, applied through the enterprise
  # team's cost center (found, or created and the team assigned to it).
  - name: platform-team-per-user
    scope: team
    team: platform-engineering
    amount: 25

  # team + metered_credits_only -> collective metered cap for that team's cost
  # center. allow_shared_cost_center lets it budget a cost center that also holds
  # other resources (default false skips a shared cost center and reports it).
  - name: platform-team-metered
    scope: team
    team: platform-engineering
    metered_credits_only: true
    amount: 300
    enforce: false
    allow_shared_cost_center: true

  # organization -> a DIRECT cap on the org's collective metered spend after the
  # shared pool (no cost center). Use metered_credits_only: true (or omit it);
  # metered_credits_only: false (a per-member org budget) is not yet supported -- use all_users or scope: user.
  - name: acme-org-metered-cap
    scope: organization
    organization: acme
    metered_credits_only: true
    amount: 4000
    enforce: false

  # enterprise -> one enterprise-wide collective metered cap (after the pool).
  - name: enterprise-cap
    scope: enterprise
    amount: 5000
    enforce: false
    alerts: [billing-admin]
